AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AEV PDF Tool - service stack. Task definition, Cloud Map registration, the ECS service, and
  the scheduled start/stop that keeps it running only during working hours. This is the only
  stack CodePipeline touches: its Deploy stage runs a CloudFormation CREATE_UPDATE here with
  the new ImageTag. Everything else is pulled from pdftool-platform through Fn::ImportValue,
  so the pipeline never has to pass it.

# =============================================================================
# NO SCALE-TO-ZERO. A FIXED SCHEDULE INSTEAD.
#
# An earlier revision let the service sleep after 30 idle minutes and woke it from a DNS query.
# It worked, and it was measured: the first request after a sleep ALWAYS failed, and the user
# had to wait ~2 minutes and reload before the site came up. Nobody should have to do that
# mid-task, so demand-driven wake-up is gone - along with its two Lambdas, its idle alarm, its
# Route 53 Resolver query logging and the Cloudflare wake worker.
#
# What replaces it is a plain timetable: the service is up from ScaleUpSchedule to
# ScaleDownSchedule and down the rest of the time. Inside working hours a user never waits;
# outside them nothing runs and nothing is billed. The failure mode is predictable rather than
# random - "it is outside working hours" is something a person can understand and work around,
# unlike "the first click always fails".
#
# It is implemented with Application Auto Scaling scheduled actions, not with Lambda +
# EventBridge like the old design. Two declarative cron entries on a scalable target do the
# whole job: no function code, no IAM role, no log group, nothing to go stale.
#
# WHO OWNS desiredCount
#
# The scalable target does - exclusively. That is why the ECS service below deliberately does
# NOT declare DesiredCount. Behaviour verified on this stack on 2026-08-26, not guessed from
# documentation:
#   - On CREATE, CloudFormation uses 1 (not the ECS API default of 0), so a task is running
#     right after the first pipeline run.
#   - On UPDATE, CloudFormation does not touch desiredCount at all. Verified by taking the
#     service to 0, updating the stack to change TaskMemory, and watching the task definition
#     go to a new revision while desiredCount stayed 0.
# That second property is what makes a deploy safe at any hour: pushing at 22:00 registers the
# new task definition and leaves the service at 0, and the next morning's scheduled start
# brings it up on the new image.
# =============================================================================

Parameters:
  ImageTag:
    Type: String
    Description: >-
      Tag in the pdftool ECR repository to deploy, a git short SHA (8 characters) produced by
      buildspec.yml. No default on purpose: the repository is IMMUTABLE so there is no "latest"
      to fall back to, and a default would let an unrelated parameter change silently redeploy
      a stale image.

  ServiceName:
    Type: String
    Default: pdftool
    AllowedPattern: "[a-z][a-z0-9-]{2,30}"

  PlatformStackName:
    Type: String
    Default: pdftool-platform
    Description: >-
      The single stack this one imports from: ECR repository, log group, both IAM roles, ECS
      cluster and the task security group.

  TaskCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: >-
      Tasks to run while the service is up. 1 is enough - the server only ships static files,
      all PDF work happens as WASM in the user's browser. Raise it to 2 if you want the service
      to survive losing a single Availability Zone, or if you switch to FARGATE_SPOT.

  CapacityProvider:
    Type: String
    Default: FARGATE
    AllowedValues: [FARGATE, FARGATE_SPOT]
    Description: >-
      FARGATE (on-demand) by default. FARGATE_SPOT is roughly 70% cheaper but AWS can reclaim
      the task on two minutes' notice, and on a single-task service that is a ~90 second outage
      at an unpredictable moment - exactly the kind of wait this design exists to avoid. Only
      choose FARGATE_SPOT together with TaskCount 2 or more.

  # ---------------------------------------------------------------- schedule

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >-
      ENABLED: the service follows ScaleUpSchedule / ScaleDownSchedule below.
      DISABLED: the scheduled actions are removed and the scalable target pins the service at
      TaskCount, i.e. it runs 24/7. Switch to DISABLED if the timetable turns out to get in
      people's way more than the bill justifies.

  ScaleUpSchedule:
    Type: String
    Default: cron(0 7 ? * * *)
    Description: >-
      When the service comes up, in Application Auto Scaling cron syntax (six fields:
      minute hour day-of-month month day-of-week year). Default: 07:00 every day.
      Every day rather than MON-FRI on purpose - a weekday-only schedule means the site is
      simply dead on a Saturday, with no wake-up path left to rescue it. Narrow it to
      "cron(0 7 ? * MON-SAT *)" or "cron(0 7 ? * MON-FRI *)" if you would rather save more and
      accept that.

  ScaleDownSchedule:
    Type: String
    Default: cron(0 20 ? * * *)
    Description: >-
      When the service goes down. Default: 20:00 every day, giving a 13-hour window and cutting
      the compute bill roughly in half. In-flight work is unaffected: everything happens in the
      browser, so stopping the task loses nothing a user has open.

  ScheduleTimezone:
    Type: String
    Default: Asia/Ho_Chi_Minh
    Description: >-
      IANA timezone the two crons are read in. Set explicitly so the schedule does not drift
      relative to office hours the way a UTC cron would.

  # ---------------------------------------------------------------- placement

  CloudMapNamespaceId:
    Type: String
    Default: ns-ox4hvwgzwledegxh
    Description: The internal.aquavietnam.vn namespace, already in place and shared with adms / adms-console.

  CloudMapServiceName:
    Type: String
    Default: pdftool
    Description: DNS label under the namespace, producing pdftool.internal.aquavietnam.vn.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: "subnet-0c0cbd6ec131f44d0,subnet-0da3b3f0179bc907c"
    Description: Private app subnets of aqua-production (app-1 / app-2), the same ones adms-console uses.

  TaskCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024']
    Description: >-
      256 (.25 vCPU) is the Fargate minimum and already generous for nginx serving static files.
      All PDF processing runs as WASM on the user's machine; the server computes nothing.

  TaskMemory:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048']

Conditions:
  ScheduleEnabled: !Equals [!Ref ScheduleState, ENABLED]

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ServiceName}-task"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${PlatformStackName}-ExecutionRoleArn"
      TaskRoleArn: !ImportValue
        Fn::Sub: "${PlatformStackName}-TaskRoleArn"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Sub
            - "${Repo}:${ImageTag}"
            - Repo: !ImportValue
                Fn::Sub: "${PlatformStackName}-RepositoryUri"
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          # Lets uid 101 (the `nginx` user of the nginx-unprivileged image) bind port 80 without
          # running as root. Same mechanism adms-console-service uses. Drop this line and the
          # container starts and immediately dies with
          # "bind() to 0.0.0.0:80 failed (13: Permission denied)".
          SystemControls:
            - Namespace: net.ipv4.ip_unprivileged_port_start
              Value: '0'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: "${PlatformStackName}-LogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref ServiceName
          HealthCheck:
            # wget is a busybox applet, present in alpine - nothing extra to install. It hits /
            # rather than a dedicated endpoint: this is a static site, and index.html being
            # served means nginx can read its document root.
            #
            # This health check used to be coupled to the idle signal of the old scale-to-zero
            # stack, which had to filter its own loopback access-log lines back out. The
            # schedule does not read logs at all, so the health check is now just a health check
            # and can be changed freely.
            Command:
              - CMD-SHELL
              - "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20

  CloudMapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref CloudMapServiceName
      NamespaceId: !Ref CloudMapNamespaceId
      DnsConfig:
        DnsRecords:
          # TTL 15: long enough that clients are not re-resolving constantly, short enough that
          # an address cached from a task replaced during a rolling deploy expires quickly. The
          # old value of 10 existed to make the wake-from-DNS path react fast and is no longer
          # needed.
          - Type: A
            TTL: 15
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !ImportValue
        Fn::Sub: "${PlatformStackName}-ClusterName"
      TaskDefinition: !Ref TaskDefinition
      # DesiredCount is deliberately absent - the scalable target below owns it. See the header.
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
          Base: 0
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "${PlatformStackName}-TaskSecurityGroupId"
          AssignPublicIp: DISABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt CloudMapService.Arn
      DeploymentConfiguration:
        # MinimumHealthyPercent 100 with MaximumPercent 200: ECS starts the new task, waits for
        # it to pass its health check and register in Cloud Map, and only then drains the old
        # one. A deploy therefore costs a few minutes of a second task instead of a gap in
        # service. The previous value of 0 traded that gap for a few cents; not making users
        # wait is the whole point of this revision.
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: SERVICE

  # ===========================================================================
  # Scheduled start/stop
  # ===========================================================================
  #
  # No RoleARN: for the ecs namespace Application Auto Scaling uses its own service-linked role
  # (AWSServiceRoleForApplicationAutoScaling_ECSService) and creates it on first use.
  #
  # MinCapacity 0 while the schedule is on is what allows the evening action to reach 0 at all -
  # a scalable target can never go below its registered minimum. The scheduled actions then move
  # that minimum up and down; the target's own value here is only the floor of what they may set.
  #
  # Note the ordering with a stack update: CloudFormation re-applies MinCapacity/MaxCapacity from
  # this template on every deploy, but neither value forces a change on its own (a lowered
  # minimum does not scale in, a raised maximum does not scale out). So a mid-day deploy leaves a
  # running service running, and a midnight deploy leaves a stopped service stopped. The next
  # scheduled action is what actually moves it.
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: ECSService
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub
        - "service/${Cluster}/${ServiceName}"
        - Cluster: !ImportValue
            Fn::Sub: "${PlatformStackName}-ClusterName"
      MinCapacity: !If [ScheduleEnabled, 0, !Ref TaskCount]
      MaxCapacity: !Ref TaskCount
      ScheduledActions: !If
        - ScheduleEnabled
        - - ScheduledActionName: !Sub "${ServiceName}-start"
            Schedule: !Ref ScaleUpSchedule
            Timezone: !Ref ScheduleTimezone
            ScalableTargetAction:
              MinCapacity: !Ref TaskCount
              MaxCapacity: !Ref TaskCount
          - ScheduledActionName: !Sub "${ServiceName}-stop"
            Schedule: !Ref ScaleDownSchedule
            Timezone: !Ref ScheduleTimezone
            ScalableTargetAction:
              MinCapacity: 0
              MaxCapacity: 0
        - !Ref AWS::NoValue

Outputs:
  ServiceName:
    Value: !Ref ServiceName
    Export:
      Name: !Sub "${AWS::StackName}-ServiceName"
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  DeployedImageTag:
    Description: The tag currently running - compare against the git short SHA to see how far the pipeline got.
    Value: !Ref ImageTag
  ServiceDnsName:
    Description: The address to hand to users.
    Value: !Sub "http://${CloudMapServiceName}.internal.aquavietnam.vn"
  ScheduleSummary:
    Description: The timetable in force, or a note that the service runs continuously.
    Value: !If
      - ScheduleEnabled
      - !Sub "up ${ScaleUpSchedule} / down ${ScaleDownSchedule} (${ScheduleTimezone})"
      - !Sub "schedule disabled - running ${TaskCount} task(s) 24/7"

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AEV PDF Tool - service stack. Task definition, Cloud Map registration and the ECS service.
  This is the only stack CodePipeline touches: its Deploy stage runs a CloudFormation
  CREATE_UPDATE here with the new ImageTag. Everything else is pulled from pdftool-platform
  through Fn::ImportValue, so the pipeline never has to pass it.

# =============================================================================
# NO SCALE-TO-ZERO, AND NO PRIVATE SCHEDULE EITHER
#
# An earlier revision let the service sleep after 30 idle minutes and woke it from a DNS query.
# It worked, and it was measured: the first request after a sleep ALWAYS failed, and the user
# had to wait ~2 minutes and reload before the site came up. Nobody should have to do that
# mid-task, so demand-driven wake-up is gone - along with its two Lambdas, its idle alarm, its
# Route 53 Resolver query logging and the Cloudflare wake worker.
#
# The obvious replacement was a pair of Application Auto Scaling scheduled actions on this
# stack. That is NOT what this template does, because account 474082330515 already runs exactly
# that mechanism account-wide:
#
#   aev-global-prod-ecs-scheduler-start  cron(0 5 * * ? *)   Asia/Bangkok
#   aev-global-prod-ecs-scheduler-stop   cron(0 23 * * ? *)  Asia/Bangkok
#        -> lambda aev-global-prod-ecs-scheduler-fn
#
# That Lambda walks EVERY cluster and EVERY service in the account, so pdftool-cluster is
# covered the moment it exists - nothing here has to opt in. At 23:00 it records the current
# desiredCount in the tag scheduler:previousDesiredCount and sets desiredCount to 0; at 05:00
# it restores that value (defaulting to 1). Services tagged scheduler:exclude=true are skipped.
#
# So the service runs 05:00-23:00 every day including weekends, on the same timetable as the
# rest of production, with zero resources declared here. Adding scheduled actions of our own
# would actively fight it: the same Lambda calls RegisterScalableTarget with
# ScheduledScalingSuspended=true at 23:00, which suspends any scheduled action this stack owns.
#
# WHO OWNS desiredCount
#
# The global scheduler does - exclusively. That is why the ECS service below deliberately does
# NOT declare DesiredCount. Behaviour verified on this stack on 2026-08-26, not guessed from
# documentation:
#   - On CREATE, CloudFormation uses 1 (not the ECS API default of 0), so a task is running
#     right after the first pipeline run.
#   - On UPDATE, CloudFormation does not touch desiredCount at all. Verified by taking the
#     service to 0, updating the stack to change TaskMemory, and watching the task definition
#     go to a new revision while desiredCount stayed 0.
# That second property is what makes a deploy safe at any hour: pushing at 23:30 registers the
# new task definition and leaves the service at 0, and the 05:00 restore brings it up on the
# new image.
#
# TO OPT OUT and run 24/7, tag the service scheduler:exclude=true and set desiredCount by hand:
#   aws ecs tag-resource --resource-arn <service-arn> --tags key=scheduler:exclude,value=true
#   aws ecs update-service --cluster pdftool-cluster --service pdftool --desired-count 1
# =============================================================================

Parameters:
  ImageTag:
    Type: String
    Description: >-
      Tag in the pdftool ECR repository to deploy, a git short SHA (8 characters) produced by
      buildspec.yml. No default on purpose: the repository is IMMUTABLE so there is no "latest"
      to fall back to, and a default would let an unrelated parameter change silently redeploy
      a stale image.

  ServiceName:
    Type: String
    Default: pdftool
    AllowedPattern: "[a-z][a-z0-9-]{2,30}"

  PlatformStackName:
    Type: String
    Default: pdftool-platform
    Description: >-
      The single stack this one imports from: ECR repository, log group, both IAM roles, ECS
      cluster and the task security group.

  CapacityProvider:
    Type: String
    Default: FARGATE
    AllowedValues: [FARGATE, FARGATE_SPOT]
    Description: >-
      FARGATE (on-demand) by default. FARGATE_SPOT is roughly 70% cheaper but AWS can reclaim
      the task on two minutes' notice, and on a single-task service that is a ~90 second outage
      at an unpredictable moment - exactly the kind of wait this design exists to avoid. Only
      choose FARGATE_SPOT if you also raise desiredCount to 2 or more.

  # ---------------------------------------------------------------- placement

  CloudMapNamespaceId:
    Type: String
    Default: ns-ox4hvwgzwledegxh
    Description: The internal.aquavietnam.vn namespace, already in place and shared with adms / adms-console.

  CloudMapServiceName:
    Type: String
    Default: pdftool
    Description: DNS label under the namespace, producing pdftool.internal.aquavietnam.vn.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: "subnet-0c0cbd6ec131f44d0,subnet-0da3b3f0179bc907c"
    Description: Private app subnets of aqua-production (app-1 / app-2), the same ones adms-console uses.

  TaskCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024']
    Description: >-
      256 (.25 vCPU) is the Fargate minimum and already generous for nginx serving static files.
      All PDF processing runs as WASM on the user's machine; the server computes nothing.

  TaskMemory:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048']

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ServiceName}-task"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !ImportValue
        Fn::Sub: "${PlatformStackName}-ExecutionRoleArn"
      TaskRoleArn: !ImportValue
        Fn::Sub: "${PlatformStackName}-TaskRoleArn"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: !Ref ServiceName
          Image: !Sub
            - "${Repo}:${ImageTag}"
            - Repo: !ImportValue
                Fn::Sub: "${PlatformStackName}-RepositoryUri"
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          # Lets uid 101 (the `nginx` user of the nginx-unprivileged image) bind port 80 without
          # running as root. Same mechanism adms-console-service uses. Drop this line and the
          # container starts and immediately dies with
          # "bind() to 0.0.0.0:80 failed (13: Permission denied)".
          SystemControls:
            - Namespace: net.ipv4.ip_unprivileged_port_start
              Value: '0'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !ImportValue
                Fn::Sub: "${PlatformStackName}-LogGroupName"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: !Ref ServiceName
          HealthCheck:
            # wget is a busybox applet, present in alpine - nothing extra to install. It hits /
            # rather than a dedicated endpoint: this is a static site, and index.html being
            # served means nginx can read its document root.
            #
            # This health check used to be coupled to the idle signal of the old scale-to-zero
            # stack, which had to filter its own loopback access-log lines back out. The
            # schedule does not read logs at all, so the health check is now just a health check
            # and can be changed freely.
            Command:
              - CMD-SHELL
              - "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20

  CloudMapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: !Ref CloudMapServiceName
      NamespaceId: !Ref CloudMapNamespaceId
      DnsConfig:
        DnsRecords:
          # TTL 15: long enough that clients are not re-resolving constantly, short enough that
          # an address cached from a task replaced during a rolling deploy expires quickly. The
          # old value of 10 existed to make the wake-from-DNS path react fast and is no longer
          # needed.
          - Type: A
            TTL: 15
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !ImportValue
        Fn::Sub: "${PlatformStackName}-ClusterName"
      TaskDefinition: !Ref TaskDefinition
      # DesiredCount is deliberately absent - aev-global-prod-ecs-scheduler-fn owns it, moving
      # it to 0 at 23:00 and back at 05:00. See the header.
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
          Base: 0
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "${PlatformStackName}-TaskSecurityGroupId"
          AssignPublicIp: DISABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt CloudMapService.Arn
      DeploymentConfiguration:
        # MinimumHealthyPercent 100 with MaximumPercent 200: ECS starts the new task, waits for
        # it to pass its health check and register in Cloud Map, and only then drains the old
        # one. A deploy therefore costs a few minutes of a second task instead of a gap in
        # service. The previous value of 0 traded that gap for a few cents; not making users
        # wait is the whole point of this revision.
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      # Explicit opt-in marker for aev-global-prod-ecs-scheduler-fn. The Lambda only skips a
      # service when this tag reads "true", so declaring "false" changes nothing functionally -
      # it is here so the next person reading this template knows the nightly stop is deliberate
      # and knows the one word to change to get out of it.
      #
      # The Lambda also writes scheduler:previousDesiredCount on this service at 23:00. That tag
      # is not declared here, so a stack update landing between 23:00 and 05:00 may strip it; the
      # only consequence is that the 05:00 restore falls back to its default of 1, which is the
      # value we want anyway.
      Tags:
        - Key: scheduler:exclude
          Value: 'false'

Outputs:
  ServiceName:
    Value: !Ref ServiceName
    Export:
      Name: !Sub "${AWS::StackName}-ServiceName"
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  DeployedImageTag:
    Description: The tag currently running - compare against the git short SHA to see how far the pipeline got.
    Value: !Ref ImageTag
  ServiceDnsName:
    Description: The address to hand to users.
    Value: !Sub "http://${CloudMapServiceName}.internal.aquavietnam.vn"
  ScheduleSummary:
    Description: Where the on/off timetable actually lives - not in this stack.
    Value: >-
      up 05:00 / down 23:00 Asia/Bangkok, every day, driven account-wide by
      aev-global-prod-ecs-scheduler-start|stop -> aev-global-prod-ecs-scheduler-fn

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Security group cho ECS task của AEV PDF Tool. Chỉ mở TCP 80 từ dải mạng nội bộ, không đứng
  sau aev-prod-alb (internet-facing) như aev-prod-ecs-service-adminsite: đây là công cụ nội bộ
  truy cập qua Site-to-Site VPN, không có lý do gì để lộ ra internet.

  Không có rule nào chạm tới RDS (khác adms-console-security-group): container không có
  backend, không kết nối database.

Parameters:
  ServiceName:
    Type: String
    Default: pdftool
    AllowedPattern: "[a-z][a-z0-9-]{2,30}"

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      Phải là vpc-02a4ec6a8e5959339 (aqua-production). Đây là VPC DUY NHẤT được gắn vào private
      hosted zone của namespace internal.aquavietnam.vn (Z04248794JU73UK411J4) -- đặt task ở
      VPC khác thì tên pdftool.internal.aquavietnam.vn không phân giải được.

  OperatorNetworkCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: >
      Dải mạng người dùng nội bộ kết nối tới, đi qua Site-to-Site VPN + Transit Gateway.
      Mặc định 10.0.0.0/8 -- đúng bằng dải mà adms-console-task-sg đang mở, dù adms-console là
      service nhạy cảm hơn nhiều (đăng nhập, dữ liệu chấm công/PII). Site này chỉ phục vụ file
      do chính người dùng tải lên trình duyệt họ, mọi xử lý chạy client-side, nên không siết
      hơn mức đã áp cho service nhạy cảm hơn. Thu hẹp lại nếu muốn chặt hơn.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: phải là CIDR, ví dụ 10.56.10.0/24.

  SecondaryNetworkCidr:
    Type: String
    Default: 172.16.0.0/15
    Description: >
      Dải thứ hai mà Transit Gateway quảng bá cùng với 10.0.0.0/8 -- hai dải này là một không
      gian định tuyến phẳng, không tách theo văn phòng. Thiếu dải này thì máy nào nằm trong
      172.16.x/172.17.x sẽ bị chặn dù vẫn định tuyến tới được, và triệu chứng là "connection
      timed out" chứ không phải lỗi rõ ràng, rất mất thời gian chẩn đoán.
      Để trống chuỗi này nếu không muốn mở dải thứ hai.
    AllowedPattern: '^((\d{1,3}\.){3}\d{1,3}/\d{1,2})?$'
    ConstraintDescription: phải là CIDR hoặc để trống.

Conditions:
  HasSecondaryCidr: !Not [!Equals [!Ref SecondaryNetworkCidr, '']]

Resources:
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ServiceName} ECS/Fargate task -- HTTP noi bo vao, HTTPS ra"
      GroupName: !Sub "${ServiceName}-task-sg"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref OperatorNetworkCidr
          Description: HTTP tu mang noi bo qua site-to-site VPN
      Tags:
        - Key: Name
          Value: !Sub "${ServiceName}-task-sg"
        - Key: Environment
          Value: Prod

  # Rule riêng chứ không nhét vào SecurityGroupIngress ở trên: dải thứ hai có thể để trống, mà
  # một phần tử trong danh sách inline thì không gắn Condition được.
  SecondaryCidrIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSecondaryCidr
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref SecondaryNetworkCidr
      Description: HTTP tu dai thu hai ma Transit Gateway quang ba

  # Egress để mặc định (allow all): task cần HTTPS ra NAT gateway để kéo image từ ECR và đẩy
  # log lên CloudWatch. Không có gì đi vào rộng thêm vì thế.

Outputs:
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-TaskSecurityGroupId"

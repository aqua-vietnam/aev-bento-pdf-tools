AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Scale-to-zero cho AEV PDF Tool: tắt khi không ai dùng, tự bật khi có truy vấn DNS tới
  pdftool.internal.aquavietnam.vn. Xem khối chú thích ngay dưới đây để hiểu đánh đổi.

# ============================================================================
# CHIỀU TẮT -- giống hệt cơ chế adms-console-scaling: metric filter trên log group của
# container -> alarm khi im lặng đủ lâu -> EventBridge -> Lambda UpdateService(desiredCount=0).
# Tín hiệu hoạt động là nginx access log: mỗi HTTP request là một dòng ra stdout.
#
# CHIỀU BẬT -- khác adms-console (bên đó bật theo lịch mỗi 60 phút). Ở đây tín hiệu "có người
# muốn vào" là chính TRUY VẤN DNS cho pdftool.internal.aquavietnam.vn. Khi service ở 0 task,
# Cloud Map gỡ bản ghi A, nên trình duyệt tra tên -> NXDOMAIN -> trang báo lỗi; nhưng truy vấn
# đó đã được Route 53 Resolver query logging ghi lại, một subscription filter đẩy thẳng sang
# Lambda và service được bật lên.
#
# ĐÁNH ĐỔI PHẢI BIẾT TRƯỚC: lần truy cập đầu tiên sau khi ngủ LUÔN thất bại. Người dùng thấy
# "không truy cập được trang" rồi phải F5 lại sau khoảng 2-4 phút (Resolver giao log về
# CloudWatch mất ~1-3 phút, cộng ~40-60 giây Fargate kéo image và khởi động). Đây là cái giá
# của việc không có gì chạy sẵn để đón request. Cách duy nhất xoá được độ trễ này là đặt một
# ALB nội bộ trước service (~18 USD/tháng, đắt hơn chính chi phí chạy task 24/7) -- nên nếu độ
# trễ trở nên khó chịu, hãy bật WakeUpScheduleState thành ENABLED để hâm nóng đầu giờ làm
# việc, đừng dựng ALB.
# ============================================================================

Parameters:
  ServiceName:
    Type: String
    Default: pdftool
    AllowedPattern: "[a-z][a-z0-9-]{2,30}"

  ClusterName:
    Type: String
    Default: pdftool-cluster

  EcsServiceName:
    Type: String
    Default: pdftool

  LogGroupName:
    Type: String
    Default: /ecs/pdftool
    Description: Output LogGroupName của pdftool-foundation.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      vpc-02a4ec6a8e5959339 (aqua-production) -- VPC sẽ bật Resolver query logging.
      LƯU Ý: mỗi VPC chỉ gắn được MỘT query-log config. Hiện tài khoản chưa có config nào
      (đã kiểm tra 2026-08-25), nhưng nếu sau này ai đó bật DNS logging toàn VPC bằng công cụ
      khác thì stack này sẽ xung đột và phải dùng chung config đó thay vì tạo mới.

  DnsName:
    Type: String
    Default: pdftool.internal.aquavietnam.vn
    Description: Tên miền dùng làm tín hiệu đánh thức. Phải khớp CloudMapServiceName + namespace.

  IdleWindowMinutes:
    Type: String
    Default: '30'
    AllowedValues: ['10', '15', '20', '25', '30', '60', '120']
    Description: >
      Số phút liên tiếp không có request nào thì tắt. 30 phút, không phải 10: BentoPDF nạp WASM
      theo kiểu lazy -- người dùng mở trang, đọc/thao tác vài phút không sinh request nào, rồi
      bấm sang một công cụ khác là lại cần kéo file từ server. Cửa sổ quá ngắn sẽ tắt service
      ngay giữa lúc họ đang dùng, và lần bấm tiếp theo phải chờ trọn chu kỳ đánh thức.

  ResolverLogRetentionInDays:
    Type: Number
    Default: 1
    AllowedValues: [1, 3, 5, 7, 14]
    Description: >
      Log này ghi MỌI truy vấn DNS trong VPC, không lọc được ở nguồn -- đó là khoản tốn kém
      duy nhất mà cơ chế đánh thức này sinh ra. Giữ 1 ngày vì nó chỉ là tín hiệu tức thời,
      không phải dữ liệu để tra cứu.

  WakeUpScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: >
      Lịch hâm nóng đầu ngày làm việc, TẮT mặc định vì yêu cầu là bật-theo-truy-cập thuần tuý.
      Bật lên nếu người dùng phàn nàn về lần truy cập hỏng đầu tiên mỗi sáng: service sẽ sẵn
      sàng lúc 07:30 các ngày trong tuần, đổi lại tốn thêm ~30 phút chạy mỗi sáng kể cả khi
      hôm đó không ai dùng.

Mappings:
  IdleWindowSecondsMap:
    '10': { Seconds: '600' }
    '15': { Seconds: '900' }
    '20': { Seconds: '1200' }
    '25': { Seconds: '1500' }
    '30': { Seconds: '1800' }
    '60': { Seconds: '3600' }
    '120': { Seconds: '7200' }

Resources:
  # ==========================================================================
  # CHIỀU TẮT: access log im lặng -> alarm -> Lambda -> desiredCount 0
  # ==========================================================================

  # FilterPattern rỗng = đếm MỌI dòng log, không chỉ dòng access.
  # Cố ý: nginx in vài dòng khởi động ("Configuration complete; ready for start up") ngay khi
  # task lên. Nhờ đó metric có điểm dữ liệu > 0 ở chu kỳ chứa lúc khởi động, alarm chuyển về OK,
  # và lần im lặng kế tiếp mới tạo được chuyển trạng thái OK -> ALARM để EventBridge bắt được.
  # Nếu chỉ đếm dòng access, một task được đánh thức mà người dùng không quay lại sẽ giữ alarm
  # ở ALARM liên tục, không có chuyển trạng thái nào, và service chạy mãi không ai tắt.
  ActivityMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: ''
      MetricTransformations:
        - MetricNamespace: AevPdfTool
          MetricName: !Sub "${ServiceName}-Activity"
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  IdleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ServiceName}-idle"
      AlarmDescription: >
        Không có dòng log nào từ container trong trọn cửa sổ idle -- an toàn để đưa service về 0.
      Namespace: AevPdfTool
      MetricName: !Sub "${ServiceName}-Activity"
      Statistic: Sum
      Period: !FindInMap [IdleWindowSecondsMap, !Ref IdleWindowMinutes, Seconds]
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: breaching

  ScaleDownFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-scale-down-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: scale-ecs-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${EcsServiceName}"

  ScaleDownFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ServiceName}-scale-down"
      Description: Đưa desiredCount về 0 khi alarm idle kêu. No-op nếu đã là 0.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScaleDownFunctionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          CLUSTER_NAME: !Ref ClusterName
          SERVICE_NAME: !Ref EcsServiceName
      Code:
        ZipFile: |
          import os
          import boto3

          ecs = boto3.client("ecs")
          CLUSTER = os.environ["CLUSTER_NAME"]
          SERVICE = os.environ["SERVICE_NAME"]

          def handler(event, context):
              current = ecs.describe_services(cluster=CLUSTER, services=[SERVICE])
              services = current.get("services", [])
              if not services:
                  print(f"Service {SERVICE} not found in cluster {CLUSTER}; nothing to scale.")
                  return {"scaled": False, "reason": "service-not-found"}

              desired = services[0]["desiredCount"]
              if desired == 0:
                  print(f"{SERVICE} already at desired count 0; no action.")
                  return {"scaled": False, "reason": "already-zero"}

              ecs.update_service(cluster=CLUSTER, service=SERVICE, desiredCount=0)
              print(f"Scaled {SERVICE} from {desired} to 0 (idle).")
              return {"scaled": True, "from": desired, "to": 0}

  ScaleDownFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScaleDownFunction}"
      RetentionInDays: 30

  AlarmToScaleDownRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ServiceName}-idle-alarm-to-scale-down"
      Description: !Sub "Goi ${ServiceName}-scale-down khi alarm idle vao trang thai ALARM."
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: ['CloudWatch Alarm State Change']
        resources: [!GetAtt IdleAlarm.Arn]
        detail:
          state:
            value: [ALARM]
      State: ENABLED
      Targets:
        - Id: ScaleDownLambda
          Arn: !GetAtt ScaleDownFunction.Arn

  ScaleDownFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScaleDownFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AlarmToScaleDownRule.Arn

  # ==========================================================================
  # CHIỀU BẬT: truy vấn DNS -> Resolver query log -> subscription filter -> Lambda
  # ==========================================================================

  ResolverQueryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/route53resolver/${ServiceName}-wake"
      RetentionInDays: !Ref ResolverLogRetentionInDays

  ResolverQueryLogConfig:
    Type: AWS::Route53Resolver::ResolverQueryLoggingConfig
    Properties:
      Name: !Sub "${ServiceName}-wake"
      DestinationArn: !GetAtt ResolverQueryLogGroup.Arn

  ResolverQueryLogAssociation:
    Type: AWS::Route53Resolver::ResolverQueryLoggingConfigAssociation
    Properties:
      ResolverQueryLogConfigId: !Ref ResolverQueryLogConfig
      ResourceId: !Ref VpcId

  ScaleUpFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-scale-up-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: scale-ecs-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${EcsServiceName}"

  ScaleUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ServiceName}-scale-up"
      Description: >
        Đưa desiredCount lên 1 khi có ai đó tra DNS tên của service. No-op nếu đang chạy.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScaleUpFunctionRole.Arn
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          CLUSTER_NAME: !Ref ClusterName
          SERVICE_NAME: !Ref EcsServiceName
      Code:
        ZipFile: |
          import os
          import boto3

          ecs = boto3.client("ecs")
          CLUSTER = os.environ["CLUSTER_NAME"]
          SERVICE = os.environ["SERVICE_NAME"]

          def handler(event, context):
              # Khong can giai nen/doc payload: subscription filter chi chuyen tiep nhung dong
              # log khop ten mien, nen viec ham nay DUOC GOI da la toan bo tin hieu.
              # Ham cung chay khi service dang bat (trinh duyet tra lai DNS moi 10 giay theo TTL)
              # -- nhung lan do thoat o nhanh already-running, chi ton mot loi goi DescribeServices.
              current = ecs.describe_services(cluster=CLUSTER, services=[SERVICE])
              services = current.get("services", [])
              if not services:
                  print(f"Service {SERVICE} not found in cluster {CLUSTER}; nothing to scale.")
                  return {"scaled": False, "reason": "service-not-found"}

              desired = services[0]["desiredCount"]
              if desired > 0:
                  return {"scaled": False, "reason": "already-running"}

              ecs.update_service(cluster=CLUSTER, service=SERVICE, desiredCount=1)
              print(f"Scaled {SERVICE} from 0 to 1 (DNS query for the service name).")
              return {"scaled": True, "from": 0, "to": 1}

  ScaleUpFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScaleUpFunction}"
      RetentionInDays: 30

  ScaleUpFunctionLogsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ScaleUpFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Sub "logs.${AWS::Region}.amazonaws.com"
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt ResolverQueryLogGroup.Arn

  # Loc chuoi thuan tren ban ghi JSON cua Resolver: khop bat ky dong nao chua ten mien, bat ke
  # AWS ghi query_name co dau cham cuoi hay khong, va bat ke truy van tra ve NXDOMAIN (luc
  # service dang ngu) hay co ban ghi A (luc dang chay).
  WakeOnDnsQueryFilter:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ScaleUpFunctionLogsInvokePermission
    Properties:
      LogGroupName: !Ref ResolverQueryLogGroup
      FilterPattern: !Sub '"${DnsName}"'
      DestinationArn: !GetAtt ScaleUpFunction.Arn

  # ==========================================================================
  # Tuỳ chọn: hâm nóng đầu giờ làm việc (mặc định TẮT)
  # ==========================================================================

  WakeUpScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-wakeup-schedule-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-scale-up
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScaleUpFunction.Arn

  WakeUpSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ServiceName}-wakeup"
      Description: Ham nong service luc 07:30 cac ngay trong tuan, gio Viet Nam.
      ScheduleExpression: "cron(30 7 ? * MON-FRI *)"
      ScheduleExpressionTimezone: Asia/Ho_Chi_Minh
      State: !Ref WakeUpScheduleState
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt ScaleUpFunction.Arn
        RoleArn: !GetAtt WakeUpScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 1
          MaximumEventAgeInSeconds: 300

Outputs:
  IdleAlarmName:
    Value: !Ref IdleAlarm
  ScaleDownFunctionName:
    Value: !Ref ScaleDownFunction
  ScaleUpFunctionName:
    Description: Goi tay ham nay de bat service ngay, khong phai cho chu ky DNS.
    Value: !Ref ScaleUpFunction
  ResolverQueryLogGroupName:
    Value: !Ref ResolverQueryLogGroup
  WakeUpScheduleName:
    Value: !Ref WakeUpSchedule

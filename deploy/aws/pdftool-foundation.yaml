AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Nền tảng cho AEV PDF Tool trên ECS/Fargate: CloudWatch Logs group và hai IAM role mà một
  Fargate task cần. Không có Secrets Manager secret như adms-console-foundation: BentoPDF là
  site tĩnh, toàn bộ xử lý PDF chạy bằng WASM trong trình duyệt, container không giữ bí mật
  nào và không gọi API nào của AWS.

  Log group ở đây còn là TÍN HIỆU IDLE của pdftool-scaling.yaml: nginx ghi access log ra
  stdout, mỗi request là một dòng. Không có dòng nào trong IdleWindowMinutes = không ai dùng.

Parameters:
  ServiceName:
    Type: String
    Default: pdftool
    AllowedPattern: "[a-z][a-z0-9-]{2,30}"
    Description: Phải khớp với pdftool-security-group.yaml và pdftool-service.yaml.

  LogRetentionInDays:
    Type: Number
    Default: 14
    Description: >
      Ngắn hơn 90 ngày của adms-console có chủ đích: log ở đây chỉ là nginx access log của một
      công cụ nội bộ, không phải hành vi quản trị trên dữ liệu PII, nên không có giá trị điều
      tra dài hạn. Giữ đủ để soi lại vài tuần sử dụng.
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/${ServiceName}"
      RetentionInDays: !Ref LogRetentionInDays

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Rỗng, cùng posture với adms-console-task-role: code trong container không gọi AWS API nào.
  # Tồn tại để sau này có tính năng cần quyền thì có chỗ gắn policy, khỏi đụng execution role.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-task-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

Outputs:
  LogGroupName:
    Description: Log group của container; cũng là nguồn tín hiệu idle cho pdftool-scaling.
    Value: !Ref LogGroup
    Export:
      Name: !Sub "${AWS::StackName}-LogGroupName"
  LogGroupArn:
    Value: !GetAtt LogGroup.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LogGroupArn"
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ExecutionRoleArn"
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TaskRoleArn"

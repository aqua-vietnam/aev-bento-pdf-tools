{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}AEV PDF TOOLS{{/if}} Logo"
          class="h-12 w-auto max-w-[160px] object-contain"
        />
        <span id="nav-brand" class="text-gray-900 font-bold text-xl ml-2">
          <a href="index.html"
            >{{#if brandName}}{{brandName}}{{else}}AEV PDF{{/if}}</a
          >
        </span>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="md:hidden flex items-center gap-4">
        <button
          id="mobile-menu-button"
          type="button"
          class="inline-flex items-center justify-center p-2 rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 transition-colors"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <span class="sr-only" data-i18n="nav.openMainMenu"
            >Open main menu</span
          >
          <!-- Hamburger Icon -->
          <svg
            id="menu-icon"
            class="block h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <!-- Close Icon -->
          <svg
            id="close-icon"
            class="hidden h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div
    id="mobile-menu"
    class="hidden md:hidden bg-white border-t border-gray-200"
  >
    <div class="px-2 pt-2 pb-3 space-y-1 text-center">
      <a href="index.html" class="mobile-nav-link" data-i18n="nav.home">Home</a>
      <a href="about.html" class="mobile-nav-link" data-i18n="nav.about"
        >About</a
      >
      <a href="contact.html" class="mobile-nav-link" data-i18n="nav.contact"
        >Contact</a
      >
      <a href="licensing.html" class="mobile-nav-link" data-i18n="nav.licensing"
        >Licensing</a
      >
      <a
        href="https://pdf-tools.aquavietnam.com.vn/docs/"
        class="mobile-nav-link"
        data-i18n="nav.docs"
        >Docs</a
      >
    </div>
  </div>
</nav>
{{/if}}
